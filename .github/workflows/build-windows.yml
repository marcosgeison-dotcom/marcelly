name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release para anexar o exe'
        required: true
        default: 'v1.0.0-alpha'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Marcelly.exe
        run: pyinstaller --onefile --noconsole --icon ui/icon.ico --name Marcelly --add-data "ui;ui" --add-data "core;core" --add-data "modules;modules" --runtime-hook pyi_rth_marcelly_path.py --collect-all tydex --collect-all brier --collect-all uvicorn --collect-all faster_whisper --collect-all pyttsx3 --collect-all webview --collect-all pystray --collect-submodules core --collect-submodules modules --paths . --hidden-import core --hidden-import core.agents --hidden-import core.debug --hidden-import core.intent_router --hidden-import core.memory --hidden-import core.mood_detector --hidden-import core.ollama_client --hidden-import core.orchestrator --hidden-import core.personality --hidden-import core.resilience --hidden-import core.skills --hidden-import core.startup --hidden-import core.tray --hidden-import core.voice --hidden-import modules --hidden-import modules.chat_module --hidden-import modules.decision_module --hidden-import modules.email_module --hidden-import modules.guidance_module --hidden-import modules.intent_router app.py

      - name: Anexar exe à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/Marcelly.exe
