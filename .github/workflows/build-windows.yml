name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release para anexar o exe'
        required: true
        default: 'v1.0.0-alpha'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Marcelly.exe
        run: pyinstaller --onefile --noconsole --icon ui/icon.ico --name Marcelly --add-data "ui;ui" --collect-all tydex --collect-all brier --collect-all uvicorn --collect-all faster_whisper --collect-all pyttsx3 --collect-all webview --collect-all pystray app.py

      - name: Anexar exe à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/Marcelly.exe
